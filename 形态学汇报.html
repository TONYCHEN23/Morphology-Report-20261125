<script>

const ORD=['io,o,v','o,io,v','io,v,o','o,v,io','v,o,io','v,io,o'].map(x=>x.split(','));
const FM={io:'εjamεnεy',o:'furiaf',v:'nisεnε'};

  '① Baseline: IO → DO → V — that is, example (3) itself.',
  '② Compared with ①: DO and IO swap — “the food” moves ahead of “the goat”.',
  '③ Compared with ①: V and DO swap — the verb shifts forward and “the food” moves to the end.',

];

`<section class="sl lit ctr" id="cover" data-n="3"><p class="eb">Morphology · Course Presentation</p><h1>A Brief Survey of<br>Kujamaat Jóola Syntax</h1><p class="lead" data-s="1">Word order and morphological marking in Kujamaat Jóola</p><div class="cred" data-s="2"><div class="cl"><span>Presenters</span><b>何典禧 · 易飞宇</b></div><div class="cl"><span>Writers</span><b>陈鸿宇 · 彭俊懿</b></div><div class="cl"><span>Slide Design</span><b>陈奕丞 · 刘诗钊</b></div><div class="cd">25 November</div></div></section>`,

P({id:'intro',n:4,eb:`Part I · Basic Word Order (SVO)`,h:'Introduction',kp:'Kujamaat Jóola belongs to the Atlantic branch of the Niger-Congo language family and is spoken primarily in the Casamance region of Senegal.<br>This presentation examines the relationship between SVO word order and morphological marking in Kujamaat Jóola syntax.',b:`<div class="chain"><div class="nd" data-s="1">Niger-Congo<small>Language Family</small></div><p class="arr" data-s="2">→</p><div class="nd" data-s="2">Atlantic<small>Branch</small></div><p class="arr" data-s="3">→</p><div class="nd" data-s="3">Kujamaat Jóola<small>Casamance, Senegal</small></div></div>`}),
P({id:'svo',n:3,eb:`Part I · Basic Word Order (SVO)`,h:'Definition of Word Order',kp:'Word order refers to the linear arrangement of Subject, Verb, and Object in a simple declarative clause.<br>In Kujamaat Jóola, the basic unmarked word order is SVO.',b:`<div class="tiles">${TL('s','S','Subject',1)}<p class="arr" data-s="2">→</p>${TL('v','V','Verb',2)}<p class="arr" data-s="3">→</p>${TL('o','O','Object',3)}</div>`}),
P({id:'ex1',n:4,eb:`Part I · Basic Word Order (SVO)`,h:'Example (1): Basic SVO Clause',kp:'Example (1) illustrates the canonical order: the subject <i>the small one</i>, the verb <i>chews</i>, and the object <i>tobacco</i>.',b:`<div class="sent" style="padding-top:44px">${wd('n1','ñaa','now','p')}${wd('s1','<span id="ag1">fú</span>-tut-af','7CL-small.one-DEF7','s',0,3)}${wd('v1','<span id="ag2">fu</span>-sumbo-e-sumbo','7CL-chew.tobacco-HAB-REDUP','v',0,3)}${wd('o1','sumba-ay','tobacco-DEF10','o',0,3)}</div>${TRN('The small one always chews tobacco',2)}`,nt:[['Agreement','The subject noun class prefix fú- (7CL) matches the verbal prefix fu- (7CL), showing obligatory subject–verb agreement.',4]]}),
P({id:'subj',n:2,eb:`Part II · Subject Position`,h:'Subject Position in Finite Clauses',kp:'Building on SVO order, we first establish the position of the subject: in a finite clause, the subject generally precedes the verb, whether realized as a lexical noun (2a) or a pronoun (2b).',b:`<div class="tiles">${TL('s','S','Subject',0)}<p class="arr">→</p>${TL('v','V','Verb',0)}</div>`,nt:[['Finite Clause','A clause whose verb carries person and aspect inflection and can stand independently as a sentence.',1],['Rule','In finite clauses, the subject consistently precedes the verb (S V).',2]]}),
P({id:'ex2a',n:2,eb:`Part II · Subject Position`,h:'Example (2a): Lexical Noun Subject',kp:'In (2a), the subject <i>a man</i> must precede the verb <i>sees</i>; placing the subject postverbally renders the clause ungrammatical.',b:`<div class="sent" id="sw2">${wd('v2','na-juk-ε','3SG-see-HAB','v',0,'0')}${wd('n2','ə-nine','1CL-man','s',0,'0')}</div><p class="vd bad" id="b0" style="align-self:flex-start">✗ *na-juk-ε ə-nine &nbsp;(ungrammatical)</p><p class="vd ok" data-s="1" style="align-self:flex-start;margin-top:-60px">✓ ə-nine na-juk-ε &nbsp;‘A man sees’</p>`,nt:[['Constraint','Postverbal subject placement (*na-juk-ε ə-nine) violates the finite-clause preverbal subject rule.',0],['Agreement','The verbal prefix na- (3SG) indexes the third-person singular subject.',2]]}),
P({id:'ex2b',n:1,eb:`Part II · Subject Position`,h:'Example (2b): Pronominal Subject',kp:'In (2b), the third-person singular pronoun <i>He</i> (ɔ) likewise precedes the verb <i>sees</i>.',b:`<div class="sent">${wd('p2','ɔ','3SG','s',0,'0')}${wd('v3','na-juk-ε','3SG-see-HAB','v',0,'0')}</div>${TRN('He sees')}`,}),
P({id:'ne0',n:3,at:'data-sp="nm:2"',eb:`Part III · Ordering of Verbal Complements`,h:'Noun Emphasis (NE)',kp:'The noun emphasis (NE) suffix <i>-ε</i> places focus on either the subject or a complement appearing before the verb.',b:`<div class="sent" style="--fs:92px;padding-top:56px;justify-content:center">${MW('nm',[['ni-','1SG','cls'],['sεn','give','root'],['-ε','NE','asp']])}</div><p class="chip asp" data-s="3" style="align-self:center">-ε &nbsp;=&nbsp; NE (Noun Emphasis)</p>`}),
P({id:'vpl',n:3,eb:`Part III · Ordering of Verbal Complements`,h:'Ordering of Verbal Complements',kp:'Within the verb phrase, complement order is relatively flexible, governed by whether the verb carries noun emphasis (NE, <i>-ε</i>). We examine both conditions below.',b:`<div class="rt" data-s="1">Does the verb carry NE (-ε)?</div><div class="two" style="margin-top:96px"><div class="pn" id="L" data-s="2"><h3>With NE</h3><p class="t">Complements are freely ordered.<br>When ambiguous: DO sits adjacent to V.</p></div><div class="pn" id="R" data-s="3"><h3>Without NE</h3><p class="t">Preverbal complements must be restated.<br>When both are restated: marker order distinguishes DO from IO.</p></div></div>`,}),
P({id:'ne',n:3,eb:`Part III · Ordering of Verbal Complements`,h:'NE and the Object Marker Slot',kp:'Sapir notes that the presence of a noun emphasis marker in verbal morphology eliminates the structural need for the corresponding noun phrase in the syntax.',b:`<div class="mw split" style="align-self:center">${mo('ni-','1SG','cls')}${mo('sεn','give','root')}<div class="mo"><div class="slot" id="slot"></div><p class="mg" style="opacity:1">Same morphological slot</p></div></div><div class="row" id="tray" data-s="1" style="align-self:center"><p class="chip asp" id="neC">-ε &nbsp;NE</p><p class="chip io" id="obC">-ɔ &nbsp;Obj marker</p></div><p class="chip s" id="npC" data-s="3" style="align-self:center">Preverbal NP</p>`,}),
P({id:'ex3',n:3,eb:`Part III · Ordering of Verbal Complements`,h:'Example (3): IO, DO, and V with NE',kp:'Using the ditransitive construction <i>give the food to the goat</i>, all six permutations of V, DO, and IO are grammatically permissible.',b:`<div class="sent">${wd('g3','ε-jamεn-εy','3CL-goat-DEF3','io',0,2)}${wd('f3','fu-ri-af','5CL-food-DEF5','o',0,2)}${wd('d3','ni-sεn-ε','1SG-give-NE','v',0,2)}</div>${TRN('I gave the food to the goat',3)}`,}),
P({id:'six',n:5,eb:`Part III · Ordering of Verbal Complements`,h:'Six Permissible Permutations',kp:'While all six orders are grammatical and differ in emphasis, the textbook does not specify the exact pragmatic nuance of each arrangement.',b:`<div class="two"><div style="flex:1;display:flex;flex-direction:column;gap:22px"><div class="row" id="pr"><p class="k io" id="c_io">${FM.io}<span>IO</span></p><p class="k o" id="c_o">${FM.o}<span>DO</span></p><p class="k v" id="c_v">${FM.v}<span>V</span></p></div><p class="cap" id="cap"></p></div><div class="ols">${ORD.map((r,i)=>`<p class="ot"><b>${'①②③④⑤⑥'[i]}</b>${r.map(x=>`<span class="${x}">${FM[x]}</span>`).join('')}</p>`).join('')}</div></div>`,nt:[['Unambiguous Reading','In (3), there is no ambiguity because we naturally give food to a goat, not a goat to food, so any word order leads to the same reading.',1]]}),
P({id:'amb',n:3,eb:`Part III · Ordering of Verbal Complements`,h:'When Ambiguity Arises',kp:KA[0],b:`<div class="sent" id="as">${wd('aA','ε-jamεn-εy','3CL-goat-DEF3','io',0,'0')}${wd('aB','fu-ri-af','5CL-food-DEF5','o',0,'0')}${wd('aV','ni-sεn-ε','1SG-give-NE','v',0,'0')}</div><p class="tr" id="atr" style="font-size:30px;margin:0"></p><p class="vd" id="avd" style="align-self:flex-start;font-size:26px"></p>`,nt:[['Semantics','Because food cannot act as a recipient, any linear permutation produces a single, unambiguous interpretation.',1],['Ambiguity','Since both “boy” and “girl” are animate and plausible recipients, linear order alone cannot disambiguate DO and IO without a structural rule.',2]]}),
P({id:'ex4',n:2,c:'',at:'data-lit="2"',eb:`Part III · Ordering of Verbal Complements`,h:'Example (4): Verb-Initial Order',kp:'When ambiguity arises, the direct object is placed closest to the verb. In verb-initial order (4), <i>boy</i> immediately follows the verb and is therefore interpreted as the DO:',b:`<div class="sent" data-max="66" style="padding-top:10px">${wd('vb4','ni-sεn-ε','1SG-give-NE','v',0,2)}${wd('bo4','a-kamban-aw','1CL-boy-DEF1','o',0,2)}${wd('gi4','a-jaŋ-aw','1CL-girl-DEF1','io',0,2)}</div><p style="margin-top:60px"></p>${TRN('I gave the boy to the girl')}`,nt:[['Conclusion','Proximity to the verb identifies “boy” as DO and “girl” as IO without additional case or agreement morphology.',2]]}),
P({id:'ex5',n:2,c:'',at:'data-lit="2"',eb:`Part III · Ordering of Verbal Complements`,h:'Example (5): Verb-Final Order',kp:'In verb-final order (5), the same proximity rule applies preverbally: <i>boy</i> sits immediately before the verb, so it remains the DO and the meaning is preserved:',b:`<div class="sent" data-max="66" style="padding-top:10px">${wd('gi5','a-jaŋ-aw','1CL-girl-DEF1','io',0,2)}${wd('bo5','a-kamban-aw','1CL-boy-DEF1','o',0,2)}${wd('vb5','ni-sεn-ε','1SG-give-NE','v',0,2)}</div><p style="margin-top:50px"></p>${TRN('I gave the boy to the girl')}`,nt:[['Comparison','Examples (4) and (5) contain the exact same lexical items and convey the same meaning; although the verb shifts position, the DO always stays adjacent to it.',2]]}),
P({id:'no_ne',n:3,eb:`Part III · Ordering of Verbal Complements`,h:'Restatement of Preverbal Complements',kp:'When the verb lacks noun emphasis (NE, <i>-ε</i>), any preverbal complement must be restated via one of two strategies: a bound person marker on the verb or a freestanding object pronoun after the verb.',b:`<p class="chip s" id="npbox" data-s="1" style="align-self:center">Preverbal complement (e.g., Alasan)</p><div class="two" style="margin-top:70px"><div class="pn" id="nA" data-s="2"><h3>Strategy 1: Bound Person Marker</h3><p class="t">An agreement suffix/infix attached directly to the verb</p></div><div class="pn" id="nB" data-s="3"><h3>Strategy 2: Freestanding Pronoun</h3><p class="t">An independent object pronoun placed postverbally</p></div></div>`,}),
P({id:'b5',n:3,at:'data-sp="bv:1" data-gh="bm:3"',eb:`Part III · Ordering of Verbal Complements`,h:'Example (6): Bound Person Marker',kp:'In (6), the preverbal indirect object <i>Alasan</i> is restated on the verb by the bound third-person singular object marker <i>-ɔ</i>.',b:`<div class="sent" style="padding-top:44px">${wd('ba','alasan','Alasan','io',0,'0')}${MW('bv',[['ni-','1SG.SUB','cls'],['sεn','give','root'],['-ɔ','3SG.OBJ','io','bm'],['-sεn','REDUP','red']])}${wd('bn','bə-kor-əb','13CL-money-DEF13','o',0,'0')}<p class="vd bad" data-s="3" style="margin-left:auto">✗ ungrammatical</p></div>${TRN('I gave Alasan the money')}`,nt:[['Obligatoriness','Omitting -ɔ- yields an ungrammatical sentence because “Alasan” is [+human], making restatement obligatory.',3]]}),
P({id:'p6a',n:2,at:'data-gh="bb6:2"',eb:`Part III · Ordering of Verbal Complements`,h:'Example (7a): Freestanding Object Pronoun',kp:'In (7a), the preverbal non-human object <i>money</i> is restated postverbally by the freestanding pronoun <i>bɔ</i> (noun class 13).',b:`<div class="sent" style="padding-top:44px">${wd('m6','bə-kor-əb','13CL-money-DEF13','o',0,'0')}${wd('v6','ni-sεn-sεn','1SG-give-REDUP','v',0,'0')}${wd('bb6','(bɔ)','(13CL)','p',0,'0')}${wd('a6','alasan','Alasan','io',0,'0')}<p class="vd ok" data-s="2" style="margin-left:auto">✓ optional (may be omitted)</p></div>${TRN('I gave the money to Alasan')}`,nt:[['Optionality','Because “money” is non-human ([–human]), restatement is merely preferable rather than obligatory, indicated by parentheses around (bɔ).',2]]}),
P({id:'p6b',n:1,eb:`Part III · Ordering of Verbal Complements`,h:'Example (7b): Non-Human Recipient',kp:'Similarly, in (7b), the freestanding pronoun <i>yɔ</i> (3CL.3SG) optionally restates the preverbal complement <i>cow</i>.',b:`<div class="sent" style="padding-top:44px">${wd('pc','e-bə:y','3CL-cow.DEF3','io',0,'0')}${wd('pv2','i-sεn','1SG-give','v',0,'0')}${wd('py','(yɔ)','(3CL.3SG)','p',0,'0')}${wd('pj','ja','if','p')}${wd('pf','fu-ri-af','5CL-food-DEF5','o',0,'0')}</div>${TRN('If I give the food to the cow')}`,}),
P({id:'human',n:4,at:'data-gh="hx:3 hbo:4"',eb:`Part III · Ordering of Verbal Complements`,h:'Animacy Condition on Restatement',kp:'Restatement is obligatory only when the preverbal constituent is [+human]. When it is [–human], as with <i>money</i> and <i>cow</i> in (7), restatement is optional.',b:`<div class="r2" style="--fs:38px"><span class="tg" data-s="1">[+human] Alasan: restatement obligatory</span><div class="sent">${wd('hal','alasan','','io')}${MW('hm',[['ni-','','cls'],['sεn','','root'],['-ɔ','','io','hx'],['-sεn','','red']],'split')}${wd('hn','bə-kor-əb','','o')}<p class="vd bad" data-s="3" style="margin-left:auto">✗ dropping -ɔ- is ungrammatical</p></div></div><div class="r2" style="--fs:38px"><span class="tg" data-s="2">[–human] money: restatement optional</span><div class="sent">${wd('hmn','bə-kor-əb','','o')}${MW('hm2',[['ni-','','cls'],['sεn','','root'],['-sεn','','red']],'split')}${wd('hbo','(bɔ)','','p')}${wd('hal2','alasan','','io')}<p class="vd ok" data-s="4" style="margin-left:auto">✓ dropping (bɔ) remains grammatical</p></div></div>`,}),
P({id:'two',n:2,eb:`Part III · Ordering of Verbal Complements`,h:'Two Preverbal Complements',kp:'When both objects precede the verb, both require restatement in principle. Sapir notes that only one is obligatory and the other optional, without specifying whether it is the DO or the IO.',b:`<div class="two"><div class="pn" data-s="1"><h3>In Principle</h3><div class="row"><p class="k o">DO preverbal</p><p class="k io">IO preverbal</p></div><p class="t">In principle, both preverbal objects can be restated.</p></div><div class="pn" data-s="2"><h3>Sapir’s Observation</h3><p class="t">Only one restatement is obligatory; the other is optional.</p><p class="t"><b class="q">?</b> &nbsp;Left unspecified whether the obligatory marker indexes DO or IO.</p></div></div>`,}),
P({id:'ex7a',n:2,at:'data-sp="va:1"',eb:`Part III · Ordering of Verbal Complements`,h:'Example (8a): IO Marker Precedes DO Marker',kp:'When both objects are restated on the verb, the bound IO pronoun precedes the bound DO pronoun. In (8a), 3PL (<i>-il</i>) precedes 3SG (<i>-ɔ</i>), identifying <i>women</i> as the IO and <i>child</i> as the DO.',b:`<div class="r2" style="--fs:46px;padding-top:60px"><div class="sent">${wd('ca','a-ɲil-aw','1CL-child-DEF1','p',0,2)}${wd('wa','ku-sεk-ak','2CL-woman-DEF2','p',0,2)}${MW('va',[['ni-','1SG','cls'],['sεn','give','root'],['-il','3PL','io','ila'],['-ɔ','3SG','o','oa'],['-sεn','REDUP','red']])}</div></div>${TRN('I gave the child to the women')}`,nt:[['Ordering Rule','The bound indirect object marker always precedes the bound direct object marker.',1],['Interpretation','“Women” (plural) matches the first marker -il (3PL) → IO; “child” (singular) matches the second marker -ɔ (3SG) → DO.',2]]}),
P({id:'ex7b',n:2,at:'data-sp="vb7:1"',eb:`Part III · Ordering of Verbal Complements`,h:'Example (8b): Reversed Marker Order',kp:'In (8b), the preverbal nouns keep the exact same linear order, but the verbal markers reverse: 3SG (<i>-ɔ</i>) precedes 3PL (<i>-i:</i>), swapping their grammatical roles.',b:`<div class="r2" style="--fs:46px;padding-top:60px"><div class="sent">${wd('cb','a-ɲil-aw','1CL-child-DEF1','p',0,2)}${wd('wb','ku-sεk-ak','2CL-woman-DEF2','p',0,2)}${MW('vb7',[['ni-','1SG','cls'],['sεn','give','root'],['-ɔ','3SG','io','mob'],['-i:','3PL','o','mib'],['-sεn','REDUP','red']])}</div></div>${TRN('I gave the women to the child')}`,nt:[['Interpretation','Because 3SG (-ɔ) now precedes 3PL (-i:), “child” is interpreted as the IO and “women” as the DO.',2]]}),
P({id:'cmp',n:2,eb:`Part III · Ordering of Verbal Complements`,h:'Distinguishing DO and IO: With vs. Without NE',kp:'Unlike clauses with noun emphasis—which rely on linear proximity to the verb—clauses without noun emphasis rely on the relative order of restatement markers.',b:`<div class="two"><div class="pn" data-s="1"><h3>With NE</h3><div class="row"><p class="k v">V</p><p class="k o">DO</p><p class="k io">IO</p></div><p class="t">By <b>proximity</b>: the DO sits closest to the verb.</p></div><div class="pn" data-s="2"><h3>Without NE</h3><div class="row"><p class="k io">-il</p><p class="k o">-ɔ</p></div><p class="t">By <b>morpheme order</b>: the IO marker precedes the DO marker.</p></div></div>`}),
P({id:'ex8',n:2,eb:`Part III · Ordering of Verbal Complements`,h:'Example (9): Two Non-Human Complements',kp:'When both preverbal constituents are non-human, only one is restated—typically the indirect object. In (9), only the IO <i>goat</i> is restated via <i>yɔ</i>.',b:`<div class="sent" style="padding-top:44px">${wd('e8g','ε-jamεn-εy','3CL-goat-DEF3','io',0,'0')}${wd('e8f','fu-ri-af','5CL-food-DEF5','o',0,'0')}${wd('e8v','ni-sεn-sεn','1SG-give-REDUP','v',0,'0')}${wd('e8y','yɔ','3CL.it','p',0,'0')}</div>${TRN('I gave the food to the goat')}`,}),
P({id:'tense',n:3,eb:`Part IV · Tense and Aspect (Optional)`,h:'Tense and Aspect',kp:'Kujamaat Jóola has a minimally developed tense category but a rich aspectual system expressed largely through verbal morphology—illustrating the tight interplay between morphology and syntax.',b:`<div class="two"><div class="pn" data-s="1" style="border-style:dashed"><h3>Tense</h3><p class="t">Deictic time reference (past vs. present)</p><p class="vd bad" style="align-self:flex-start">✗ not grammatically marked</p></div><div class="pn" data-s="2"><h3>Aspect</h3><div class="row"><p class="chip asp">Duration</p><p class="chip asp">Completion</p><p class="chip asp">Doubt</p></div></div></div>`,}),
P({id:'unm',n:2,eb:`Part IV · Tense and Aspect (Optional)`,h:'Temporal Ambiguity of Unmarked Verbs',kp:'An unmarked verb form carries no tense inflection and can be interpreted as either present or past depending on discourse context.',b:`<div class="sent">${wd('ub','e-bəy','3CL-cow.DEF3','o',0,'0')}${wd('uv','ni-ŋar-ε','1SG.SUB-take-NE','v',0,'0')}</div><p class="tr">‘I <span id="tg">take / took</span> the cow’</p>`,nt:[['Context Dependence','Because the verb bears no morphological tense marker, temporal reference is inferred entirely from context.',2]]}),
P({id:'fut',n:3,at:'data-sp="fa:1 fb:3"',eb:`Part IV · Tense and Aspect (Optional)`,h:'Future Marking',kp:'In main clauses, future reference is marked by a resultative prefix placed outside the subject agreement marker: affirmative <i>pan-</i> (<i>pa-</i> before nasals) and negative <i>lɛt-</i>.',b:`<div class="r2" style="--fs:52px;padding-top:50px"><div class="sent">${MW('fa',[['pa-','RES','asp','pa'],['ni-','1SG.SUB','cls','fni'],['ŋar','take','root']])}${wd('fc','e-bəy','3CL-cow.DEF3','o')}${TRN('I will take the cow',2).replace('class="tr"','class="tr" style="align-self:center;margin-left:30px"')}</div></div><div class="r2" data-s="3" style="--fs:52px;padding-top:0"><div class="sent">${MW('fb',[['lɛt-','RES.NEG','asp'],['i-','1SG.SUB','cls'],['maŋ','want','root']])}${TRN('I won’t want')}</div></div>`,nt:[['Negation','In negative future clauses, the negative resultative prefix lɛt- (RES.NEG) replaces pa-.',3]]}),
P({id:'rel',n:2,eb:`Part IV · Tense and Aspect (Optional)`,h:'Future in Relative Clauses',kp:'Within relative clauses, future reference is expressed by the resultative clitic <i>-pi</i> combined with the class agreement prefix of the relativized noun.',b:`<div class="sent" style="padding-top:44px">${wd('rc','a-ɲil-aw','1CL-child-DEF1','o',0,'0')}${wd('rp','a-pi','1CL-RES','asp')}${wd('rb','bakari','Bakari','s',0,'0')}${wd('rw','a-pɔs-i','1CL-wash-2SG.OBJ','v',0,'0')}</div>${TRN('the child whom Bakari will wash for you',1)}`,}),
P({id:'dub',n:3,at:'data-sp="dv:1"',eb:`Part IV · Tense and Aspect (Optional)`,h:'Dubitive-Incompletive Suffix -ɛ:n',kp:'The suffix <i>-ɛ:n</i> marks an event as incomplete or uncertain. Combined with the negative resultative prefix <i>lɛt-</i>, it conveys epistemic possibility (“might” or “might not have”).',b:`<div class="sent" style="--fs:54px">${MW('dv',[['lɛt-','RES.NEG','asp'],['u-','2SG.SUB','cls'],['juk','see','root'],['-ɛ:n','INC','asp'],['-ɔl','3SG.OBJ','io']])}</div>${TRN('If you had been looking for Bassen, you might not have seen him',3)}`,nt:[['-ɛ:n (INC)','Marks incomplete or doubtful action; the antecedent clause nu-ɲɛs-ɛ:n-ɛ (“you were looking”) likewise carries -ɛ:n.',2],['lɛt- + -ɛ:n','Co-occurring with lɛt-, the construction expresses counterfactual or uncertain completion (“might not have seen”).',3]]}),
P({id:'recap',n:7,eb:`Part V · Summary`,h:'Summary',kp:'',b:[
['Basic Order','Kujamaat Jóola has a basic SVO word order, with the subject generally preceding the verb in finite clauses.','s'],
['Two Regimes','Complement ordering within the VP splits into two patterns depending on whether the verb carries noun emphasis (NE, -ε).','v'],
['With NE','V, IO, and DO permute freely; when ambiguity arises, the DO sits closest to the verb. Pragmatic differences across permutations remain open.','o'],
['Without NE','Preverbal complements must be restated either via a bound person marker on the verb or a freestanding postverbal pronoun.','io'],
['One Complement','Restatement is obligatory for [+human] preverbal complements, whereas for [–human] complements it is merely preferable.','io'],
['Two Complements','Only one restatement is obligatory (Sapir); when both are marked, the IO marker precedes the DO marker. If both are [–human], only the IO is usually restated.','io'],
['Tense & Aspect','The verb carries no tense marking, so the same form can be interpreted as either past or present, whereas aspectual distinctions are richly inflected.','p']

P({id:'concl',n:2,eb:`Part V · Summary`,h:'Conclusion',kp:'Kujamaat Jóola allows considerable freedom in linear word order—and even lacks a grammaticalized tense category—while relying heavily on verbal morphology to encode grammatical relations.',b:`<div class="two"><div class="pn" data-s="1"><h3>Linear Order: High Freedom</h3><div class="row" id="sh"><p class="k io">IO</p><p class="k o">DO</p><p class="k v">V</p></div><p class="mut">No dedicated morphological tense category</p></div><div class="pn" data-s="2"><h3>Verb Morphology: Encodes Grammar</h3>${MW('lk',[['ni-','1SG.SUB','cls'],['sεn','give','root'],['-ɔ','3SG.OBJ','io'],['-sεn','REDUP','red']],'split scatter')}</div></div>`}),
