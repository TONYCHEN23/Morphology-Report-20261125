<style>

 border-radius:14px;background:rgba(255,255,255,.86);cursor:pointer;opacity:.42;
 transition:opacity .25s,background .25s,border-color .25s;z-index:50}

#fs::before{top:13px;left:13px;border-right:0;border-bottom:0;border-radius:3px 0 0 0}

#fs.on::after{bottom:11px;right:11px;border-left:3px solid var(--s);border-top:0;transform:rotate(45deg)}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

const KA=['例 (3)：山羊 – 食物 – 动词。语义上只能把食物给羊，不可能把羊给食物。','调换语序（食物 – 山羊 – 动词）：意思没有变，仍然只有一种理解。','把名词换成 boy 与 girl，再看同样的排列：谁是直宾、谁是间宾，已经分不清了。','把名词换成 boy 与 girl，再看同样的排列：谁是直宾、谁是间宾，已经分不清了。'];
const H=[
`<section class="sl lit ctr" id="cover" data-n="3"><p class="eb">MORPHOLOGY · 形态学课程汇报</p><h1>A Brief Survey of<br>Kujamaat Jóola Syntax</h1><p class="lead" data-s="1">Kujamaat Jóola 句法简述：语序与动词形态标记</p><div class="cred" data-s="2"><div class="cl"><span>汇报人</span><b>何典禧　易飞宇</b></div><div class="cl"><span>写稿</span><b>陈鸿宇　彭俊懿</b></div><div class="cl"><span>PPT制作</span><b>陈奕丞　刘诗钊</b></div><div class="cd">11月25日</div></div></section>`,
P({id:'toc',n:5,eb:`目录`,h:'目录',kp:'本报告考察 Kujamaat Jóola 中 SVO 语序与动词形态标记之间的关系，分为以下五个部分。',b:`<div class="toc" data-s="1"><p class="no">1</p><div><h3>语言背景与符号说明</h3><p class="mut">Kujamaat Jóola 概况 · 术语表 · 句子成分标记 · 例句格式</p></div></div><div class="toc" data-s="2"><p class="no">2</p><div><h3>基本语序 SVO 与主语位置</h3><p class="mut">例 (1)(2)：SVO；限定性小句中主语位于动词之前</p></div></div><div class="toc" data-s="3"><p class="no">3</p><div><h3>动词补语的顺序</h3><p class="mut">名词强调标记 NE · 3.2 带 NE：六种排列与歧义 · 3.3 不带 NE：重述</p></div></div><div class="toc" data-s="4"><p class="no">4</p><div><h3>附加：时—体系统</h3><p class="mut">无时态、体范畴发达：将来体、关系从句、疑问-未完成体</p></div></div><div class="toc" data-s="5"><p class="no">5</p><div><h3>总结</h3><p class="mut">论证脉络 · 结论 · 小结表</p></div></div>`}),
P({id:'intro',n:4,eb:`1.1 语言背景`,h:'Kujamaat Jóola 是一门什么语言',kp:'它属于尼日尔-刚果语系下的大西洋语支，主要分布在西非塞内加尔（Senegal）的卡萨蒙斯（Casamance）地区。',b:`<div class="chain"><div class="nd" data-s="1">尼日尔-刚果语系<small>Niger-Congo</small></div><p class="arr" data-s="2">→</p><div class="nd" data-s="2">大西洋语支<small>Atlantic</small></div><p class="arr" data-s="3">→</p><div class="nd" data-s="3">Kujamaat Jóola<small>塞内加尔 · 卡萨蒙斯</small></div></div>`,nt:[['本节讨论','Kujamaat Jóola 句法中，SVO 的排列顺序与形态标记规则之间的关系。',4]]}),
P({id:'abbr',n:3,eb:`1.2 符号说明`,h:'术语与缩写表',kp:'例句中的大写缩写会反复出现。下表列出本报告用到的术语与缩写，按人称与数、名词类、动词形态分组。',b:`<div class="two"><div class="pn" data-s="1"><h3>人称与数</h3>${AB([['1SG','第一人称单数：我'],['2SG','第二人称单数：你'],['3SG','第三人称单数：他 / 她 / 它'],['3PL','第三人称复数：他们']])}</div><div class="pn" data-s="2"><h3>名词类</h3>${AB([['CL','名词类；7CL = 第 7 类'],['DEF','定指后缀；DEF7 = 与第 7 类对应']])}<p class="mut">类前缀会在名词、动词上重复出现，彼此“一致”（agreement）。</p></div><div class="pn" data-s="3"><h3>动词形态</h3>${AB([['SUB / OBJ','主语 / 宾语标记'],['HAB','惯常体'],['REDUP','重叠：词根重复'],['NE','名词强调标记'],['RES','结果性标记'],['INC','未完成体']])}</div></div>`}),
P({id:'roles',n:5,eb:`1.2 符号说明`,h:'句子成分与下划线颜色',kp:'后面的例句用下划线颜色与标签标出各成分：S（主语，蓝）、V（动词，紫）、DO（直接宾语，青绿）、IO（间接宾语，洋红）。先用英语句子对照。',b:`<div class="sent">${wd('r1','I','主语：做动作的人','s',1,1)}${wd('r2','gave','动词：动作','v',2,2)}${wd('r3','the food','直接宾语：被给予的东西','o',3,3)}${wd('r4','to the goat','间接宾语：接受者','io',4,4)}</div>${TRN('我把食物给了山羊',4)}`,nt:[['为什么要区分','英语靠介词 to 和固定的顺序区分直宾与间宾。Kujamaat Jóola 的顺序较自由，这个区分如何做到，正是本报告要回答的问题。',5]]}),
P({id:'gloss',n:3,eb:`1.2 符号说明`,h:'例句的逐语素切分与释义格式',kp:'例句按三行呈现：原文（以连字符切分语素）、逐语素释义、自然译文。语素是最小的音义结合单位。',at:'data-sp="g1:2 g2:2"',b:`<div class="sent" style="gap:70px;--fs:64px">${MW('g1',[['ə-','1CL','cls'],['nine','man','root']])}${MW('g2',[['na-','3SG','cls'],['juk','see','root'],['-ε','HAB','asp']])}</div>${TRN('A man sees',3)}`,nt:[['第 1 行：原文','连字符 “-” 标出语素边界：ə- 是名词类前缀，nine 是词根“男人”。',1],['第 2 行：释义','与第 1 行逐个对应：1CL = 第 1 类，3SG = 第三人称单数，HAB = 惯常体。',2],['第 3 行：译文','自然语言的翻译：A man sees。',3]]}),
P({id:'svo',n:3,eb:`2.1 基本语序 SVO`,h:'起点：基本语序 SVO',kp:'语序的定义：简单陈述句中 Subject（主语）、Verb（动词）、Object（宾语）的排列顺序。在 Kujamaat Jóola 中，基本顺序是 SVO。',b:`<div class="tiles">${TL('s','S','Subject　主语',1)}<p class="arr" data-s="2">→</p>${TL('v','V','Verb　动词',2)}<p class="arr" data-s="3">→</p>${TL('o','O','Object　宾语',3)}</div>`,nt:[['要点','后面所有规则，都以 SVO 作为出发点来讨论。',3]]}),
P({id:'ex1',n:4,eb:`2.1 基本语序 SVO`,h:'例 (1)：SVO 的实际例子',kp:'主语 the small one、动词 chews、宾语 tobacco，依次排列，这就是 S–V–O。',b:`<div class="sent" style="padding-top:90px">${wd('n1','ñaa','now','p')}${wd('s1','<span id="ag1">fú</span>-tut-af','7CL-small.one-DEF7','s',0,3)}${wd('v1','<span id="ag2">fu</span>-sumbo-e-sumbo','7CL-chew.tobacco-HAB-REDUP','v',0,3)}${wd('o1','sumba-ay','tobacco-DEF10','o',0,3)}</div>${TRN('The small one always chews tobacco',2)}`,nt:[['读法','ñaa 是副词 now，不参与 S–V–O 的排列；其余三个词依次是 S、V、O。',1],['一致','主语的类前缀 fú-（7CL）与动词的类前缀 fu-（7CL）相同：动词上的形态在配合主语。',4]]}),
P({id:'subj',n:2,eb:`2.2 主语位置`,h:'限定性小句中，主语位于动词之前',kp:'在这一基础上，先明确主语的位置：在限定性小句（finite clause）中，主语一般置于动词之前。',b:`<div class="tiles">${TL('s','S','Subject',0)}<p class="arr">→</p>${TL('v','V','Verb',0)}</div>`,nt:[['限定性小句','动词带有人称、体等形态标记，可以独立成句的小句。',1],['规则','Finite clause: Subject always precedes the verb（S V）。',2]]}),
P({id:'ex2a',n:2,eb:`2.2 主语位置`,h:'例 (2a)：名词作主语',kp:'A man 是主语，置于动词 sees 之前。',b:`<div class="sent" id="sw2">${wd('v2','na-juk-ε','3SG-see-HAB','v',0,'0')}${wd('n2','ə-nine','1CL-man','s',0,'0')}</div><p class="vd bad" id="b0" style="align-self:flex-start">✗ *na-juk-ε ə-nine　不合语法</p><p class="vd ok" data-s="1" style="align-self:flex-start;margin-top:-60px">✓ ə-nine na-juk-ε　${'‘A man sees’'}</p>`,nt:[['为什么','把名词放到动词后面不合语法（* 表示不合语法）。这个反例是依据“主语在动词前”这条规则推出来的。',0],['一致','动词上的 na-（3SG）是主语标记，与主语保持一致。',2]]}),
P({id:'ex2b',n:1,eb:`2.2 主语位置`,h:'例 (2b)：代词作主语',kp:'代词 ɔ（He）同样置于动词之前。',b:`<div class="sent">${wd('p2','ɔ','3SG','s',0,'0')}${wd('v3','na-juk-ε','3SG-see-HAB','v',0,'0')}</div>${TRN('He sees')}`,nt:[['对比','(2b) 与 (2a) 的动词形式完全相同，只是主语由名词换成了代词。',1]]}),
P({id:'ne0',n:3,at:'data-sp="nm:2"',eb:`3.1 名词强调标记（NE）`,h:'名词强调标记 NE',kp:'后面的规则取决于动词上有没有一个后缀 -ε。它叫名词强调标记（noun emphasis，简称 NE），用来强调出现在动词前面的主语或补语。',b:`<div class="sent" style="--fs:68px">${MW('nm',[['ni-','1SG','cls'],['sεn','give','root'],['-ε','NE','asp']])}</div><p class="chip asp" data-s="3" style="align-self:flex-start">-ε　=　NE（noun emphasis，名词强调标记）</p>`,nt:[['动词的构成','以 3.2 例 (3) 的动词 ni-sεn-ε 为例（见第 15 页）：它由人称前缀、词根和一个后缀组成。',1],['拆分','ni-（1SG，“我”）+ sεn（“给”）+ -ε（NE）。',2],['小结','动词带 -ε：带 NE（3.2）；不带 -ε：不带 NE（3.3）。下一页给出整体分叉。',3]]}),
P({id:'vpl',n:3,eb:`3.1 名词强调标记（NE）`,h:'动词前后的成分怎么排',kp:'在动词短语（VP）中，补语成分的顺序总体较为自由，但根据情况不同有一些规则。下面按动词带不带 NE（上一页的 -ε），分两种情况介绍。',b:`<div class="rt" data-s="1">动词是否带 NE（-ε）？</div><div class="two" style="margin-top:100px"><div class="pn" id="L" data-s="2"><h3>带 NE（3.2）</h3><p class="t">补语排列自由<br>有歧义时：直宾紧邻动词</p></div><div class="pn" id="R" data-s="3"><h3>不带 NE（3.3）</h3><p class="t">前置补语必须被重述<br>两个宾语都重述时：依标记顺序区分</p></div></div>`,nt:[['补语','动词之外、与动词一起构成 VP 的成分，例如直接宾语和间接宾语。',3]]}),
P({id:'ne',n:3,eb:`3.1 名词强调标记（NE）`,h:'NE 占据宾语标记的位置',kp:'NE 与宾语标记占据动词上的同一个位置，因此它的有无会影响句法成分的顺序。',b:`<div class="mw split" style="align-self:center">${mo('ni-','1SG','cls')}${mo('sεn','give','root')}<div class="mo"><div class="slot" id="slot"></div><p class="mg" style="opacity:1">同一个位置</p></div></div><div class="row" id="tray" data-s="1" style="align-self:center"><p class="chip asp" id="neC">-ε　NE</p><p class="chip io" id="obC">-ɔ　宾语标记</p></div><p class="chip s" id="npC" data-s="3" style="align-self:center">动词前的名词短语 NP</p>`,nt:[['Sapir 的观点','形态上出现 NE，就消除了句法上对应名词短语的必要性。',3],['所以','先看 3.2（带 NE），再看 3.3（不带 NE）。',3]]}),
P({id:'ex3',n:3,eb:`3.2 带 NE`,h:'例 (3)：间宾、直宾、动词',kp:'以“动词 – 直宾 – 间宾”为例：三个成分、六种排列方式都是允许的。先看基准句。',b:`<div class="sent">${wd('g3','ε-jamεn-εy','3CL-goat-DEF3','io',0,2)}${wd('f3','fu-ri-af','5CL-food-DEF5','o',0,2)}${wd('d3','ni-sεn-ε','1SG-give-NE','v',0,2)}</div>${TRN('I gave the food to the goat',3)}`,nt:[['读法','ε-jamεn-εy “山羊”（间宾），fu-ri-af “食物”（直宾），ni-sεn-ε “我给”（-ε 是 NE）。',1]]}),
P({id:'six',n:5,eb:`3.2 带 NE`,h:'六种排列：每一种是怎样“交换”出来的',kp:'三个成分共有 3×2×1 = 6 种排列。每换一种，句子的意思不变，仍是 ‘I gave the food to the goat’。',b:`<div class="two"><div style="flex:1;display:flex;flex-direction:column;gap:22px"><div class="row" id="pr"><p class="k io" id="c_io">${FM.io}<span>IO</span></p><p class="k o" id="c_o">${FM.o}<span>DO</span></p><p class="k v" id="c_v">${FM.v}<span>V</span></p></div><p class="cap" id="cap"></p></div><div class="ols">${ORD.map((r,i)=>`<p class="ot"><b>${'①②③④⑤⑥'[i]}</b>${r.map(x=>`<span class="${x}">${FM[x]}</span>`).join('')}</p>`).join('')}</div></div>`,nt:[['为什么意思不变','(3) 没有歧义：语义上只能把食物给羊，不可能把羊给食物，所以怎么排都不会误解。',1],['强调什么？','不同排列各自强调的具体信息，教材没有指明；我们推测可能与语用因素有关。',5]]}),
P({id:'amb',n:3,eb:`3.2 带 NE`,h:'顺序自由，会带来歧义',kp:KA[0],b:`<div class="sent" id="as">${wd('aA','ε-jamεn-εy','3CL-goat-DEF3','io',0,'0')}${wd('aB','fu-ri-af','5CL-food-DEF5','o',0,'0')}${wd('aV','ni-sεn-ε','1SG-give-NE','v',0,'0')}</div><p class="tr" id="atr" style="font-size:32px;margin:0"></p><p class="vd" id="avd" style="align-self:flex-start;font-size:28px"></p>`,nt:[['语义','食物不可能“接受”山羊，所以无论怎么排，听者都只会得到同一种理解。',1],['歧义','boy 和 girl 都可能是直宾，也都可能是间宾；光看顺序分不出来。',2],['有歧义时的规则','把直宾放在离动词最近的地方，依据与动词的距离区分直宾和间宾。',3]]}),
P({id:'ex4',n:2,c:'',at:'data-lit="2"',eb:`3.2 带 NE`,h:'动词在句首：直宾紧跟动词',kp:'规则（postverbal components）：动词居首时，直宾紧跟在动词后面。例 (4) 中 boy 离动词更近，所以 boy 是直宾。',b:`<div class="sent" style="padding-top:10px">${wd('vb4','ni-sεn-ε','1SG-give-NE','v',0,2)}${wd('bo4','a-kamban-aw','1CL-boy-DEF1','o',0,2)}${wd('gi4','a-jaŋ-aw','1CL-girl-DEF1','io',0,2)}</div><p style="margin-top:60px"></p>${TRN('I gave the boy to the girl')}`,nt:[['读法','箭头表示到动词的距离：boy 较近，girl 较远。',1],['结论','boy 是直宾，girl 是间宾，不需要任何额外标记。',2]]}),
P({id:'ex5',n:2,c:'',at:'data-lit="2"',eb:`3.2 带 NE`,h:'动词在句末：直宾紧邻动词之前',kp:'规则（preverbal components）：动词居末时，直宾紧挨在动词前面。例 (5) 中 boy 仍离动词更近，所以 boy 仍是直宾，句意不变。',b:`<div class="sent" style="padding-top:10px">${wd('gi5','a-jaŋ-aw','1CL-girl-DEF1','io',0,2)}${wd('bo5','a-kamban-aw','1CL-boy-DEF1','o',0,2)}${wd('vb5','ni-sεn-ε','1SG-give-NE','v',0,2)}</div><p style="margin-top:90px"></p>${TRN('I gave the boy to the girl')}`,nt:[['对照','(4) 与 (5) 用的词相同、句意也相同；变的是动词的位置，不变的是“直宾离动词最近”。',2]]}),
P({id:'mid',n:3,eb:`3.2 带 NE`,h:'为什么动词不能放在中间',kp:'教材没有说明，我们推测：动词只能放在最前或最后，这样两个宾语到动词的距离才有差别；动词放在中间的两种排列不被允许。',b:[['v,o,io','到动词的距离：DO 1，IO 2 → 能区分',1,1],['io,o,v','到动词的距离：IO 2，DO 1 → 能区分',1,2],['io,v,o','到动词的距离：IO 1，DO 1 → 距离相同，无法区分',0,3]].map(r=>`<div class="mrow" data-s="${r[3]}">${r[0].split(',').map(c=>`<p class="k ${c}">${{v:'V',o:'DO',io:'IO'}[c]}</p>`).join('')}<p class="t">${r[1]}</p><p class="vd ${r[2]?'ok':'bad'}">${r[2]?'✓':'✗'}</p></div>`).join(''),nt:[['说明','以上是我们的推测，教材没有明确说明。',3]]}),
P({id:'no_ne',n:3,eb:`3.3 不带 NE`,h:'没有 NE：前置补语必须被重述',kp:'如果动词没有被 NE 标记，那么动词前面的成分需要被重述（restated）。重述有两种方式：在动词上加 bound person marker，或在动词后加一个宾语代词。',b:`<p class="chip s" id="npbox" data-s="1" style="align-self:center">动词前的补语（如 Alasan）</p><div class="two" style="margin-top:70px"><div class="pn" id="nA" data-s="2"><h3>方式一：bound person marker</h3><p class="t">加在动词上的绑定人称标记</p></div><div class="pn" id="nB" data-s="3"><h3>方式二：freestanding object pronoun</h3><p class="t">放在动词后面的独立宾语代词</p></div></div>`,nt:[['术语','bound：黏附在动词上，不能单独成词；freestanding：可以独立成词。',3]]}),
P({id:'b5',n:3,at:'data-sp="bv:1" data-gh="bm:3"',eb:`3.3.1 一个前置成分`,h:'方式一：bound person marker',kp:'先看只有一个成分在动词前的情况：Alasan 在动词前，动词上加 ɔ 这个标记来重述它。',b:`<div class="sent" style="padding-top:90px">${wd('ba','alasan','Alasan','io',0,'0')}${MW('bv',[['ni-','1SG.SUB','cls'],['sεn','give','root'],['-ɔ','3SG.OBJ','io','bm'],['-sεn','REDUP','red']])}${wd('bn','bə-kor-əb','13CL-money-DEF13','o',0,'0')}<p class="vd bad" data-s="3" style="margin-left:auto">✗ 不合语法</p></div>${TRN('I gave Alasanne the money')}`,nt:[['读法','ɔ 是 3SG.OBJ（第三人称单数宾语标记），回指前面的 Alasan；末尾的 -sεn 是重叠（REDUP）。',2],['检验','省略 -ɔ- 就不合语法：Alasan 是人（[+human]），必须重述。',3]]}),
P({id:'p6a',n:2,at:'data-gh="bb6:2"',eb:`3.3.1 一个前置成分`,h:'方式二：freestanding object pronoun',kp:'money 在动词前，动词后加上代词 bɔ 来重述它。bɔ 可以独立成词，13CL 说明它与 money 同属第 13 类。',b:`<div class="sent" style="padding-top:90px">${wd('m6','bə-kor-əb','13CL-money-DEF13','o',0,'0')}${wd('v6','ni-sεn-sεn','1SG-give-REDUP','v',0,'0')}${wd('bb6','(bɔ)','(13CL)','p',0,'0')}${wd('a6','alasan','Alasan','io',0,'0')}<p class="vd ok" data-s="2" style="margin-left:auto">✓ 省略仍合语法</p></div>${TRN('I gave the money to Alasanne')}`,nt:[['读法','bɔ 位于动词之后，重述前置的 money。',1],['为什么可以省略','money 不是人（[–human]），所以 (bɔ) 带括号：可以不出现。',2]]}),
P({id:'p6b',n:1,eb:`3.3.1 一个前置成分`,h:'同样的方式：cow 由 yɔ 重述',kp:'cow 在动词前，动词后的 yɔ 重述它；ja 的意思是“如果”。',b:`<div class="sent" style="padding-top:90px">${wd('pc','e-bə:y','3CL-cow.DEF3','io',0,'0')}${wd('pv2','i-sεn','1SG-give','v',0,'0')}${wd('py','(yɔ)','(3CL.3SG)','p',0,'0')}${wd('pj','ja','if','p')}${wd('pf','fu-ri-af','5CL-food-DEF5','o',0,'0')}</div>${TRN('If I give the food to the cow')}`,nt:[['读法','yɔ 同时带有名词类（3CL）和人称数（3SG）的信息，是独立的宾语代词。',1]]}),
P({id:'human',n:4,at:'data-gh="hx:3 hbo:4"',eb:`3.3.1 一个前置成分`,h:'什么时候必须重述',kp:'前置成分是人（[+human]）时，重述是强制的（例 5）；不是人（[–human]）时，重述只是更常见（preferable），并非强制（例 6）。',b:`<div class="r2" style="--fs:44px"><span class="tg" data-s="1">[+human] Alasan：重述强制</span><div class="sent">${wd('hal','alasan','','io')}${MW('hm',[['ni-','','cls'],['sεn','','root'],['-ɔ','','io','hx'],['-sεn','','red']],'split')}${wd('hn','bə-kor-əb','','o')}<p class="vd bad" data-s="3" style="margin-left:auto">✗ 去掉 -ɔ- 不合语法</p></div></div><div class="r2" style="--fs:44px"><span class="tg" data-s="2">[–human] money：重述可选</span><div class="sent">${wd('hmn','bə-kor-əb','','o')}${MW('hm2',[['ni-','','cls'],['sεn','','root'],['-sεn','','red']],'split')}${wd('hbo','(bɔ)','','p')}${wd('hal2','alasan','','io')}<p class="vd ok" data-s="4" style="margin-left:auto">✓ 去掉 (bɔ) 仍合语法</p></div></div>`,nt:[['所以','例 (6) 中的 (bɔ)、(yɔ) 带括号，表示这类代词可以不出现。',4]]}),
P({id:'two',n:2,eb:`3.3.2 两个前置成分`,h:'直宾、间宾都在动词前',kp:'如果两个宾语都在动词前，理论上它们都需要被重述；两者都可以用 bound 代词来重述（例 7）。',b:`<div class="two"><div class="pn" data-s="1"><h3>理论上</h3><div class="row"><p class="k o">DO 前置</p><p class="k io">IO 前置</p></div><p class="t">两个都可以被重述。</p></div><div class="pn" data-s="2"><h3>Sapir 的说法</h3><p class="t">只有一个是强制的，另一个是可选的。</p><p class="t"><b class="q">?</b>　但他没有说明强制的是直宾还是间宾。</p></div></div>`,nt:[['下面讨论','接下来两页，讨论两个宾语都被重述的情形。',2]]}),
P({id:'ex7a',n:2,at:'data-sp="va:1"',eb:`3.3.2 两个前置成分`,h:'例 (7a)：-il 在前，-ɔ 在后',kp:'两个都被重述时，间宾的代词标记放在直宾的代词标记之前。动词里先出现 3PL（-il），后出现 3SG（-ɔ）。',b:`<div class="r2" style="--fs:46px;padding-top:110px"><div class="sent">${wd('ca','a-ɲil-aw','1CL-child-DEF1','p',0,2)}${wd('wa','ku-sεk-ak','2CL-woman-DEF2','p',0,2)}${MW('va',[['ni-','1SG','cls'],['sεn','give','root'],['-il','3PL','io','ila'],['-ɔ','3SG','o','oa'],['-sεn','REDUP','red']])}</div></div>${TRN('I gave the child to the women')}`,nt:[['规则','The bound indirect object pronoun precedes the direct object pronoun：间宾标记在前。',1],['判断','women 是复数，对应更靠前的 3PL 标记 -il → women 是间宾；child 对应靠后的 -ɔ → child 是直宾。',2]]}),
P({id:'ex7b',n:2,at:'data-sp="vb7:1"',eb:`3.3.2 两个前置成分`,h:'例 (7b)：-ɔ 在前，-i: 在后',kp:'同样的规则：动词里先出现 3SG（-ɔ），后出现 3PL（-i:）。名词的顺序与 (7a) 完全相同，角色却互换了。',b:`<div class="r2" style="--fs:46px;padding-top:110px"><div class="sent">${wd('cb','a-ɲil-aw','1CL-child-DEF1','p',0,2)}${wd('wb','ku-sεk-ak','2CL-woman-DEF2','p',0,2)}${MW('vb7',[['ni-','1SG','cls'],['sεn','give','root'],['-ɔ','3SG','io','mob'],['-i:','3PL','o','mib'],['-sεn','REDUP','red']])}</div></div>${TRN('I gave the women to the child')}`,nt:[['判断','women 的 3PL 标记现在靠后 → women 是直宾；child 的 3SG 标记靠前 → child 是间宾。',2],['形式变化','3PL 放在后面时，形式由 -il 变成 -i:。教材未说明原因，可能是某种形态变化。',2]]}),

  fsBtn.setAttribute('title',on?'退出全屏（Esc 或 F 键）':'进入全屏（F 键）');
  setTimeout(()=>{fit();lay()},120);
}
function toggleFs(){
  if(fsEl()){
    (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen).call(document);
  }else{
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen||el.webkitRequestFullScreen;
    if(!req){fsBtn.classList.add('nofs');setTimeout(()=>fsBtn.classList.remove('nofs'),1200);return;}
    try{const p=req.call(el);
      if(p&&p.catch)p.catch(()=>{fsBtn.classList.add('nofs');setTimeout(()=>fsBtn.classList.remove('nofs'),1200);});
    }catch(e){fsBtn.classList.add('nofs');setTimeout(()=>fsBtn.classList.remove('nofs'),1200);}
  }
}
['fullscreenchange','webkitfullscreenchange','msfullscreenchange'].forEach(t=>document.addEventListener(t,syncFs));
fsBtn.addEventListener('click',e=>{e.stopPropagation();toggleFs()});
addEventListener('resize',fit);fit();go(0,0);(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{fit();lay()});
</script></body></html>
